<!DOCTYPE html>
<html>
<head>
  <title>LED Blink Fill</title>
</head>
<body>
  <label for="r">Red:</label>
  <input type="number" id="r" placeholder="Red (0-255)" min="0" max="255" value="255"><br><br>

  <label for="g">Green:</label>
  <input type="number" id="g" placeholder="Green (0-255)" min="0" max="255" value="0"><br><br>

  <label for="b">Blue:</label>
  <input type="number" id="b" placeholder="Blue (0-255)" min="0" max="255" value="255"><br><br>

  <label for="speed">Speed:</label>
  <input type="number" id="speed" placeholder="Speed (e.g. 0.1)" step="0.01" value="1"><br><br>

  <button onclick="sendRequestBlink()">Blink Fill</button>
  <button onclick="sendRequestClear()">Clear</button>

  <script src="script.js"></script>
</body>
</html>
